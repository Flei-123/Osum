# marke.conf -- DIE MARKE AN EINEM ORT.
#
# Nachgebaut nach der Vorlage aus Justins FreeViewer,
# /root/projects/freeviewer/src/brand.rs. Dort steht der Zweck in einem
# Satz, und er gilt hier genauso:
#
#   "Marke an EINEM Ort. Wer ein zweites Produkt will (z. B. 'Xoffi
#    Remote' fuer eine andere Firma), baut mit gesetzten
#    Umgebungsvariablen."
#
# ======================================================================
# UMBENENNEN IST EIN BAUAUFRUF, KEIN CODEEINGRIFF
# ======================================================================
#
# Genau wie FV_BRAND_* dort, schlagen hier OSUM_MARKE_* die Werte aus
# dieser Datei -- zur BAUZEIT, in EINER Zeile:
#
#   OSUM_MARKE_PRODUKT="Xoffi OS" OSUM_MARKE_HERSTELLER="Xoffi GmbH" \
#   OSUM_MARKE_KURZ=xoffi OSUM_MARKE_WEB=https://xoffi.example \
#   OSUM_MARKE_FEED=https://store.xoffi.example/xoffi \
#   bash tools/usbimg/build.sh /tmp/bau
#
# Ohne diese Variablen bleibt alles OrientOS. Das ist dieselbe Regel
# wie in der Vorlage, und sie ist der Grund, warum niemand fuer eine
# Umbenennung eine Zeile Quelltext anfassen muss.
#
# Die Reihenfolge ist die des Repos (siehe tools/config, OSUM_GUI):
# Umgebung schlaegt marke.conf. Eine Befehlszeilenoption gibt es
# bewusst nicht -- die Marke ist keine Laune eines einzelnen Laufs.
#
# ======================================================================
# WAS SICH MIT DEM NAMEN AENDERT -- UND WAS NIEMALS
# ======================================================================
#
# Die Vorlage sagt: "Protokoll, Relay und IDs sind bei allen Marken
# gleich - jeder Build kann mit jedem reden." Uebertragen heisst das
# hier: EIN UMBENANNTER BAU MUSS DIESELBEN STICKS LESEN UND DIESELBEN
# PAKETE VERSTEHEN. Deshalb bleiben fest verdrahtet:
#
#   OSUM-OFS          die Kennung im Superblock (kernel/fs.fi)
#   OSUMMOD\n         die Kennung des Modulformats (kernel/module.fi)
#   .osp              die Endung der Anwendungsbuendel
#   osum.mb           der Dateiname des Kerns im Abbild
#   SSH-2.0-OsumSSH   die Kennung auf dem Draht (kernel/user/sshd.fi)
#   osum_panic        ein SYMBOL, aufgerufen aus .s und Platz 73 der
#                     Modultafel -- ein Symbolname ist kein Anzeigetext
#   0x6D75734F        die CPUID-Kennung des Hypervisors (eine ABI)
#   ABI-Nummern       die Systemaufrufnummern
#   /users/osum/…     Pfade
#   osum: …           die Modulvorsilbe auf der seriellen Leitung
#                     (docs/I18N.md: der Mitschnitt wird nicht
#                     uebersetzt -- er benennt das Modul, nicht die Marke)
#
#   osum backup v1 …  die Trennlabel der Schluesselableitung. Das ist
#                     der haerteste Fall: wer die aendert, macht JEDE
#                     bestehende Sicherung unlesbar. Das waere kein
#                     Umbenennen, das waere Datenverlust.
#
# Die Regel dahinter steht in docs/NAMING.md und docs/I18N.md und ist
# aelter als diese Runde: die Struktur ist eine Schnittstelle fuer
# Programme, und Programme lesen keine Marketingnamen.
#
# DESHALB GIBT ES HIER AUCH KEIN EXE UND KEIN DIR. Die Vorlage braucht
# beide, weil unter Windows der Programmname und der Ordner in
# "Programme" Anzeigetext SIND. Hier sind ihre Entsprechungen --
# osum.mb, /users/osum, .osp -- genau die Bezeichner, die sich nicht
# bewegen duerfen. Das ist der eine bewusste Unterschied zur Vorlage.
#
# ======================================================================
# DIE FELDER
# ======================================================================
#
# PRODUKT     (= NAME)      Anzeigename ueberall: Bootmenue,
#                           Fensterinhalt, Kopfzeilen, Diagnose.
# KERN                      Der Kern darunter. Startprotokoll,
#                           Fassungszeile, Panik -- so wie `Linux` im
#                           dmesg steht und nicht im Startbildschirm.
#                           Dieses Feld hat die Vorlage nicht; hier
#                           gibt es zwei Namen, und sie sind nicht
#                           dasselbe.
# HERSTELLER  (= PUBLISHER) Die Firma ueber dem Produkt.
# KURZ        (= SLUG)      Kleingeschrieben, ohne Leerzeichen. Steht
#                           in Dateinamen und in der Fassungszeile.
#                           ACHTUNG: der Frischebeleg in
#                           docs/BLECH-BEREIT.md sucht "<KURZ> <hash>"
#                           im fertigen Abbild.
# WEB         (= WEB)       Oeffentliche Adresse der Marke.
# FEED        (= FEED)      Eigener Update-Feed pro Marke. Die zweite
#                           Entwurfsentscheidung der Vorlage:
#                           "Ein Xoffi-Build darf sich nie zum
#                           FreeViewer aktualisieren." Der Wert landet
#                           als `quelle=` in /etc/ota.conf; ein
#                           umbenannter Bau holt damit NIE die Pakete
#                           der anderen Marke.
#
# FASSUNG steht NICHT hier -- sie kommt aus git und wird beim Bauen
# eingesetzt (kernel/version.fi, tools/build-kernel.sh). Eine Fassung,
# die man von Hand pflegt, ist eine Fassung, die luegt.
#
# Abgeleitet (nicht gespeichert, wie `reg_key()` in der Vorlage):
#   der Dateiname des Abbilds = PRODUKT kleingeschrieben, ohne
#   Leerzeichen, plus "-usb.img"  ->  orientos-usb.img
#
# Laengen: PRODUKT/KERN/HERSTELLER/KURZ hoechstens 31 Zeichen,
# WEB/FEED hoechstens 95 (kernel/brand.fi). Der Bau bricht ab, wenn ein
# Feld nicht passt -- ein abgeschnittener Name faellt sonst erst auf
# dem Bildschirm auf.

PRODUKT="OrientOS"
KERN="Osum"
HERSTELLER="fleitec"
KURZ="osum"
WEB="https://fleitec.com/orientos"
FEED="https://store.fleitec.com/osum"
