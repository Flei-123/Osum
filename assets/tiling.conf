# /users/osum/config/tiling.conf -- the tiling key map, i3 style.
bind mod+h focus-left
bind mod+l focus-right
bind mod+k focus-up
bind mod+j focus-down
bind mod+shift+h move-left
bind mod+shift+l move-right
bind mod+shift+k move-up
bind mod+shift+j move-down
bind mod+e layout-split
bind mod+w layout-tabbed
bind mod+s layout-stacked
bind mod+v split-v
bind mod+b split-h
bind mod+r rotate
bind mod+m mirror
bind mod+u balance
bind mod+f float
bind mod+q close
# ======================================================== RUNDE GRIFF
# SUPER + PFEILE: DIE HALBEN UND DIE VIERTEL.
#
# `tile_snap` (kernel/wm.fi:6892) kann seit Runde TILING acht Ziele --
# vier Haelften und vier VIERTEL -- und `tile.fi` kennt seit damals die
# acht Namen (`snap-left` ... `snap-bottomright`). Gebunden waren davon
# genau ZWEI. Der Rest war fertig gebaut und ueber die Tastatur nicht
# erreichbar; das ist der billigste Gewinn, den diese Runde zu vergeben
# hat -- sechs Zeilen fuer sechs Anordnungen, kein neuer Code.
#
# DIE BELEGUNG IST DIE, DIE WINDOWS SEIT VISTA HAT und die GNOME und
# KDE uebernommen haben: Super+Links/Rechts halbiert, Super+Hoch
# maximiert bzw. legt nach oben, Super+Runter legt nach unten. Die
# Viertel liegen auf Super+Umschalt+Pfeil, weil dort schon die
# Verwandtschaft "dasselbe Ziel, feiner" sitzt.
bind mod+left snap-left
bind mod+right snap-right
bind mod+up snap-top
bind mod+down snap-bottom
bind mod+shift+left snap-topleft
bind mod+shift+right snap-topright
bind mod+shift+up snap-bottomleft
bind mod+shift+down snap-bottomright
bind mod+t tiling-toggle
# RUNDE TUERSCHLOSS: Alt+Tab wechselt das Fenster.
# `mod` ist auf diesem System die Alt-Taste (kbd.fi schiebt jede Taste
# mit Alt in den Kuerzelring), `tab` ist Abtastcode 15 -> Zeichen 9.
# Die Handlung geht NICHT ueber den Kachelbaum, sondern durch die
# Fensterliste -- deshalb wirkt sie auch bei schwebenden Fenstern, und
# genau das war der Befund 4.3 aus Runde DURCHKLICK.
bind mod+tab next-window
