# /users/osum/config/tiling.conf -- the tiling key map, i3 style.
bind mod+h focus-left
bind mod+l focus-right
bind mod+k focus-up
bind mod+j focus-down
bind mod+shift+h move-left
bind mod+shift+l move-right
bind mod+shift+k move-up
bind mod+shift+j move-down
bind mod+e layout-split
bind mod+w layout-tabbed
bind mod+s layout-stacked
bind mod+v split-v
bind mod+b split-h
bind mod+r rotate
bind mod+m mirror
bind mod+u balance
bind mod+f float
bind mod+q close
bind mod+left snap-left
bind mod+right snap-right
bind mod+t tiling-toggle
