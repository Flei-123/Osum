# /etc/jarvis/rechte.conf -- DIE VORLAGE FUER JUSTINS EIGENES ABBILD.
#
# ============================================================ ACHTUNG
# DAS IST NICHT DIE MITGELIEFERTE FASSUNG. Die heisst
# `assets/jarvis/rechte.conf`, und dort ist ALLES VERBOTEN -- das ist
# die richtige Voreinstellung fuer einen Stick, den irgendjemand
# irgendwo hineinsteckt.
#
# DIESE Datei ist die Fassung fuer EINEN Rechner, dessen Besitzer den
# Server auf der anderen Seite selbst betreibt und weiss, was er
# freigibt. `tools/usbimg/build.sh` nimmt sie nur, wenn man sie
# ausdruecklich verlangt:
#
#     JARVIS_CONF=assets/jarvis/rechte-justin.conf tools/usbimg/build.sh ...
#
# Ohne diese Umgebungsvariable bleibt es bei "nichts erlaubt".
# ====================================================================
#
# Der Helfer liest diese Datei VOR JEDEM AUFTRAG neu. Eine Aenderung
# hier gilt ab dem naechsten Auftrag, ohne dass irgendetwas neu
# gestartet wird -- wer ein Recht entzieht, hat es sofort entzogen.

# ---------------------------------------------------------- der Server
#
# ZWEI ZEILEN, UND SIE GEHOEREN ZUSAMMEN. `server` sagt, WOHIN die
# Verbindung geht, `servername` sagt, WELCHEN NAMEN das Zertifikat der
# Gegenseite tragen MUSS. Traegt es einen anderen, wird die Verbindung
# abgelehnt -- auch dann, wenn die Adresse stimmt. Das ist der ganze
# Schutz gegen einen Rechner, der sich als der Server ausgibt.
#
# WARUM HIER EINE ZAHL UND KEIN NAME STEHT: Osum hat inzwischen einen
# Namensaufloeser (`lib/libc/dns.fi`, Runde FETCH) -- docs/BRIDGE.md
# fuehrte das noch als offenen Punkt 3. Der Helfer selbst benutzt ihn
# NICHT: eine Namensaufloesung vor dem Verbindungsaufbau ist eine
# zweite Stelle, an der jemand umlenken kann, und sie bringt fuer einen
# festen Server nichts. Die Zahl steht hier, der Name wird geprueft.
#
# 192.168.1.54 ist der JARVIS-Server im Heimnetz (jarvis.fleitec.com).
# Steht der Osum-Rechner ausserhalb, gehoert hier die oeffentliche
# Adresse hin -- und das Zertifikat muss denselben Namen tragen.
# ============================================ RUNDE MERGE-11: DER WEG
#
# `weg = https` schickt das Zeilenprotokoll durch HTTPS-POSTs an
# store.fleitec.com, Port 443. DAS IST DIE EINSTELLUNG, DIE DIESES
# GERAET BRAUCHT, und sie ist hier ab Werk richtig gesetzt -- es ist
# NICHTS von Hand einzutragen.
#
# WARUM. Der alte Weg (`weg = roh`) waehlt einen rohen TLS-Port auf
# einer festen Adresse. Das setzt voraus, dass dieser Rechner den
# Server ueberhaupt erreichen kann. Er steht aber in einem ANDEREN
# Heimnetz hinter NAT: 192.168.1.x auf beiden Seiten, zufaellig
# dieselbe Nummerierung, zwei verschiedene Netze. Ohne Portfreigabe am
# Router geht dorthin nichts, und genau deshalb hat sich dieses Geraet
# nie gemeldet.
#
# Port 443 geht aus jedem fremden Netz hinaus. Gemessen am 10.09.2026:
#     POST https://store.fleitec.com/bruecke/anmelden
#         -> {"fehler": "keine Kennung"}
# also die Antwort des Brueckendienstes, nicht ein 404 des Speichers.
weg            = https

# Der NAME, nicht die Zahl. Ueber 443 wird der Name aufgeloest (der
# Aufloeser aus Runde FETCH, lib/libc/dns.fi) -- und das Zertifikat
# MUSS auf genau diesen Namen lauten, sonst wird abgelehnt. Umlenken
# nuetzt also niemandem: geprueft wird der Name, nicht die Adresse.
servername     = store.fleitec.com
pfad           = /bruecke/draht
wurzeln        = /etc/ssl/roots.pem

# Der alte Weg, zum Nachschlagen. `weg = roh` und eine Zahl hier, dann
# spricht dieses Geraet wieder das Zeilenprotokoll auf einem rohen
# Port -- sinnvoll nur, wenn Geraet und Server im SELBEN Netz stehen.
# server         = 192.168.1.54:8443

# ------------------------------------------------------------- Rechte

# Duerfen ueberhaupt Programme gestartet werden?
befehle        = ja

# Wenn ja: NUR diese, mit vollem Pfad. Es gibt keine Muster und keine
# Shell -- das erste Wort des Auftrags muss WOERTLICH einem dieser
# Eintraege gleichen. Hoechstens sechs.
#
# `/bin/sh` steht hier ABSICHTLICH NICHT: Osums Shell kennt kein `-c`,
# und eine Zeichenkette durch eine Shell ist die klassische Stelle, an
# der aus einem erlaubten Befehl ein beliebiger wird.
befehl_erlaubt = /bin/ls
befehl_erlaubt = /bin/cat
befehl_erlaubt = /bin/echo
befehl_erlaubt = /bin/ps
befehl_erlaubt = /bin/uname
befehl_erlaubt = /bin/df

# Was gelesen werden darf. Ein Eintrag mit '/' am Ende ist ein
# Verzeichnisvorspann, alles andere ist genau eine Datei.
lesen          = /home/
lesen          = /tmp/
lesen          = /var/jarvis/
lesen          = /var/log/jarvisd.log

# Was geschrieben werden darf. ABSICHTLICH ENGER als `lesen`: /etc und
# /bin stehen hier nicht, und das ist kein Versehen. Ein Server, der
# einem Geraet in /bin schreiben darf, besitzt das Geraet.
schreiben      = /home/
schreiben      = /tmp/
schreiben      = /var/jarvis/

# Welche Verzeichnisse aufgelistet werden duerfen.
auflisten      = /home/
auflisten      = /tmp/
auflisten      = /var/jarvis/
auflisten      = /

# Bildschirmfotos.
#
# ZWEI SCHLOESSER, UND DIESE ZEILE IST NUR DAS ERSTE. Auch bei `ja`
# braucht es zusaetzlich einen Schein. Auf einem Kern MIT
# SYS_OSUM_SHOT (1841, Runde FEEDBACK ueber BRIDGE-2) stellt den DER
# KERN aus, und er gibt ihn nur der Wurzel oder der Taskleiste -- ein
# Fehler in diesem Programm kann daran nichts aendern. Auf einem Kern
# ohne den Aufruf faellt der Helfer auf /dev/fb zurueck, und dann
# braucht es `jarvisctl fotoschein` von einem Menschen am Geraet.
bildschirmfoto = ja

# Die Eckdaten der Maschine (Fassung, Speicher, Platte, Aufgaben, Zeit).
systeminfo     = ja

# ------------------------------------------------------------ Grenzen
# Ohne die beiden Zahlen kann ein Server diesem Geraet mit einer grossen
# Datei den Speicher wegnehmen. Grosszuegiger als die Vorlage, weil ein
# Bildschirmfoto von 1920x1080 als PNG darueber liegen kann.
max_ausgabe    = 262144
max_datei      = 4194304

# ------------------------------------------------------------- Ablagen
protokoll       = /var/log/jarvisd.log
arbeitsdatei    = /var/jarvis/ausgabe.txt
fotoscheindatei = /var/jarvis/fotoschein
