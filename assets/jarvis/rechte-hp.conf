transport       = https
servername      = store.fleitec.com
path            = /bruecke/draht
roots           = /etc/ssl/roots.pem
watchdog        = 600
commands        = yes
command_allowed = /bin/ls
command_allowed = /bin/cat
command_allowed = /bin/echo
command_allowed = /bin/ps
command_allowed = /bin/uname
command_allowed = /bin/df
command_allowed = /bin/date
command_allowed = /bin/du
command_allowed = /bin/find
command_allowed = /bin/grep
command_allowed = /bin/head
command_allowed = /bin/tail
command_allowed = /bin/wc
command_allowed = /bin/dhcp
command_allowed = /bin/log
command_allowed = /bin/host
command_allowed = /bin/jarvisctl
command_allowed = /bin/netstat
command_allowed = /bin/ping
command_allowed = /bin/nettest
command_allowed = /bin/hwid
command_allowed = /bin/hwinv
command_allowed = /bin/sntp
command_allowed = /bin/top
command_allowed = /bin/id
command_allowed = /bin/storage
sysinfo         = yes
screenshot      = yes
input           = no
read            = /proc/
read            = /var/jarvis/
read            = /var/log/
read            = /system/
read            = /tmp/
read            = /users/
read            = /etc/jarvis/permissions.conf
read            = /etc/time.conf
read            = /etc/ntp.conf
read            = /etc/resolv.conf
