# /etc/jarvis/rechte.conf -- was der JARVIS-Helfer auf DIESEM Rechner darf.
#
# Diese Datei gehoert dem Menschen an der Tastatur, nicht dem Server.
# Der Helfer liest sie VOR JEDEM AUFTRAG neu; eine Aenderung hier gilt
# ab dem naechsten Auftrag, ohne dass irgendetwas neu gestartet wird.
#
# DIE VOREINSTELLUNG IST NEIN. Was hier nicht steht, ist nicht erlaubt.
# Eine leere Liste heisst "nichts", nicht "alles".
#
# Zeilen sind `schluessel = wert`. Alles ab '#' ist Kommentar. Die
# Listenschluessel (lesen, schreiben, auflisten, befehl_erlaubt) duerfen
# mehrfach vorkommen; hoechstens sechs Eintraege je Liste.

# ---------------------------------------------------------- der Server
# Es gibt in diesem System KEINEN Namensaufloeser. Also steht hier eine
# Zahl, und der Name, den das Zertifikat tragen MUSS, steht daneben.
# Traegt es einen anderen, wird die Verbindung abgelehnt -- das ist der
# ganze Sinn der zwei Zeilen.
server         = 10.9.0.1:8443
servername     = jarvis.test
wurzeln        = /etc/ssl/roots.pem

# ------------------------------------------------------------- Rechte

# Duerfen ueberhaupt Programme gestartet werden?
befehle        = nein

# Wenn ja: NUR diese, mit vollem Pfad. Es gibt keine Muster und keine
# Shell -- das erste Wort des Auftrags muss WOERTLICH einem dieser
# Eintraege gleichen.
befehl_erlaubt = /bin/echo
befehl_erlaubt = /bin/ls

# Was gelesen werden darf. Ein Eintrag mit '/' am Ende ist ein
# Verzeichnisvorspann, alles andere ist genau eine Datei.
lesen          = /var/jarvis/
lesen          = /var/log/jarvisd.log

# Was geschrieben werden darf. Absichtlich enger als `lesen`.
schreiben      = /var/jarvis/

# Welche Verzeichnisse aufgelistet werden duerfen.
auflisten      = /var/jarvis/

# Bildschirmfotos. Auch bei `ja` braucht es zusaetzlich einen
# einmaligen Schein von `jarvisctl fotoschein` -- ein Recht in dieser
# Datei allein reicht dafuer NICHT.
bildschirmfoto = nein

# Die Eckdaten der Maschine (Fassung, Speicher, Platte, Aufgaben, Zeit).
systeminfo     = ja

# ------------------------------------------------------------ Grenzen
# Ohne die beiden Zahlen kann ein Server diesem Geraet mit einer grossen
# Datei den Speicher wegnehmen.
max_ausgabe    = 65536
max_datei      = 262144

# ------------------------------------------------------------- Ablagen
protokoll       = /var/log/jarvisd.log
arbeitsdatei    = /var/jarvis/ausgabe.txt
fotoscheindatei = /var/jarvis/fotoschein
