# /etc/hotkeys.conf -- global shortcuts (W-S3, docs/HOTKEYS.md). Read by /bin/hotkeyd (started with `wmplug enable hotkeyd`).
#
#     <ctrl+alt+key> <app>.<action>
#
# The key must contain Ctrl+Alt. The app (text before the first '.') needs the right `hotkey`
# (apprights set <app> hotkey); a line for an app without it is refused and nothing is bound.
# A key that is already bound is reported as a conflict, never overwritten.
ctrl+alt+j jarvismini.toggle
