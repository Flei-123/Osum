# /etc/wmregeln.conf -- die Regeln der Fensterregel-Engine (/bin/plugregel).
#
# EINE ZEILE IST EINE REGEL. Sie wird auf jedes Fenster angewandt, das
# waehrend der Laufzeit des Plugins AUFGEHT (Ereignis E_WIN_OPEN); die
# erste passende Regel gewinnt, danach wird nicht weitergesucht. Fenster,
# die schon vor dem Plugin da waren, fasst es nicht an -- eine
# Regel-Engine, die beim Start alles umraeumt, waere keine Hilfe,
# sondern eine Ueberraschung.
#
# WAS EINE ZEILE TREFFEN LAESST (mindestens eines, beides ist UND):
#   app=<buendel>     der Buendelname des Programms (WM_APP, Feld WL_APP),
#                     genau verglichen. /bin/calc meldet "rechner".
#   titel=<teil>      ein Teilwort des Fenstertitels (Feld WL_TITLE).
#
# WAS EINE ZEILE TUT (beliebig viele, in dieser Reihenfolge ausgefuehrt):
#   flaeche=N         Fenster auf Arbeitsflaeche N legen   (PA_DESK)
#   schwebend         aus dem Kachelbaum nehmen            (PA_FLOAT 1)
#   kacheln           in den Kachelbaum geben              (PA_FLOAT 0)
#   groesse=BxH       Groesse setzen                       (PA_SIZE)
#   ort=X,Y           an eine feste Stelle setzen          (PA_MOVE)
#   zentriert         in die Mitte der Arbeitsflaeche      (PA_MOVE)
#   ebene=N           Fensterebene setzen (1 = normal)     (PA_LAYER)
#   zeigen            diese Arbeitsflaeche sichtbar machen (PA_DESKGO)
#
# JEDE DIESER HANDLUNGEN BRAUCHT DAS RECHT R_ACT_WIN (0x100). Es kommt
# aus /etc/wmplug.conf und wird von /bin/wmplug als root eingetragen;
# fehlt es, meldet das Plugin `abgewiesen` und macht weiter -- es stirbt
# nicht, und der Fensterserver merkt nichts davon.

# Der Rechner gehoert auf Flaeche 2, schwebend und in die Mitte. `zeigen`
# schaltet auf diese Flaeche um, damit man das Ergebnis auch sieht --
# ohne das Wort landet das Fenster dort, bleibt aber verborgen, solange
# Flaeche 2 nicht die sichtbare ist.
app=rechner flaeche=2 schwebend zentriert zeigen

# Das Terminal wird gekachelt UND an eine Stelle gesetzt. Die Zeile steht
# hier als zweite Regel, damit der Abnahmelauf belegen kann, dass NICHT
# jede Regel auf jedes Fenster passt.
#
# WARUM `ort=2,40` DAZUGEKOMMEN IST (RUNDE FIX-R3-1): `kacheln` legt das
# Fenster auf den Kachelplatz (0,0), und der Fensterserver malt die
# TITELLEISTE OBERHALB dieser Koordinate -- auf den Abnahmebildern 04/05
# war sie darum am oberen Schirmrand abgeschnitten (gemessen:
# `nachgemessen id=7 x=0 y=0`). 40 Bildpunkte sind mehr als die
# Rahmenhoehe, die Leiste steht damit vollstaendig im Bild; 2 statt 0 in
# x laesst den linken Rahmen sichtbar.
titel=Terminal kacheln ort=2,40
