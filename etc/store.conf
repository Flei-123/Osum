# /etc/store.conf -- who may install and remove programs from the store.
# Read by /bin/stored (root); the file must belong to root and not be writable by others.
#
#   installieren=admin     admin | benutzer | aus     (also covers "Neue Fassung")
#   entfernen=admin        admin | benutzer | aus
#   admins=1000            more administrators: uids, comma separated
#
# admin    uid 0, uid 1000 (the account the installer made) and the uids in `admins`
# benutzer every signed-in account (never `nobody`)
# aus      nobody -- the window only lists
installieren=admin
entfernen=admin
admins=1000
