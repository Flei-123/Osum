# /etc/wmplug.conf -- WER WAS DARF. Gelesen von /bin/wmplug (enable),
# NICHT vom Kern: der Kern kennt beim Hochlauf noch kein Dateisystem und
# soll auch keine Namenspolitik machen. `wmplug enable <name>` schickt
# die Maske mit WM_PLUG_GRANT (2126) hinunter -- das geht nur als root.
#
# Eine Zeile je Erweiterung:
#
#     <name> rechte=0x<maske> [frist=<ticks>] [prog=/bin/<datei>]
#
# `frist=` ist die Zeit, die dieses eine Plugin zwischen zwei
# Abholungen verstreichen lassen darf (100 Ticks = 1 Sekunde, kernel/
# time.fi TICK_HZ=100). Ohne die Angabe gilt die Vorgabe des Kerns
# (50 Ticks). Ein Plugin OHNE Eintrag hier darf sich hoechstens zwei
# Sekunden selbst nehmen (kernel/wmplug.fi, FRIST_MAX_SELBST) -- laenger
# gibt nur diese Datei, und diese Datei liest nur root.
#
# `prog=` ist das Programm, das `wmplug enable <name>` STARTET. Ohne die
# Angabe gewaehrt `enable` nur die Rechte und startet nichts -- so war es
# vorher, und Plugins, die schon laufen, sollen davon nichts merken.
#
# Alles hinter `#` ist Bemerkung. Ein Name, der hier nicht steht, bekommt
# beim Anmelden R_DEFAULT = 0x1F aus dem Kern: ZUSEHEN, NICHTS ANFASSEN.
# Das ist die Vorgabe und nicht das Ergebnis dieser Datei.
#
# DIE BITS (kernel/wmplug.fi, R_*):
#
#     0x001 R_EV_WIN      Fenster geht auf / zu
#     0x002 R_EV_FOCUS    Fokus wechselt
#     0x004 R_EV_DESK     Arbeitsflaeche wechselt
#     0x008 R_EV_TILE     Kachelbaum hat sich geaendert
#     0x010 R_EV_KEY      ein belegtes Kuerzel wurde gedrueckt
#     0x100 R_ACT_WIN     fremde Fenster setzen (Ort, Groesse, Ebene, Flaeche)
#     0x200 R_ACT_FOCUS   Fokus setzen
#     0x400 R_ACT_KEY     ein Kuerzel belegen
#     0x800 R_ACT_BAR     Text in die Leiste schicken
#
# JEDES BIT WIRD EINZELN GEPRUEFT, und zwar im Kern vor der Handlung
# (sysgui.fi, do_plugact). Wer ein Recht nicht hat, bekommt E_RIGHTS und
# der Zustand des Fensters bleibt, wie er war -- nachzurechnen an PL_DENY.

# Das Leistenwidget. Es darf alles SEHEN, was es fuer seine Anzeige
# braucht, und genau eine Sache TUN: Text abliefern. Fenster anfassen
# muss eine Uhr nicht, also darf sie es auch nicht.
uhr rechte=0x807 frist=100 prog=/bin/pluguhr

# Die Fensterregel-Engine. Sie braucht das Gegenteil: sie sieht nur, dass
# ein Fenster aufgeht, und setzt es dann an seinen Platz.
regel rechte=0x301 frist=500 prog=/bin/plugregel

# Das Programm der Gegenprobe (kernel/user/plugboese.fi). Es bekommt
# ABSICHTLICH nur das Zusehen -- damit `plugboese greif` beim Griff nach
# einem fremden Fenster einen Fehlercode bekommt und das Fenster
# nachweislich stehen bleibt. Wer diese Zeile aufbohrt, macht die
# Rechte-Gegenprobe der Runde kaputt.
boese rechte=0x001 prog=/bin/plugboese

# Dasselbe Programm im Absturzmodus (`plugboese segv`) meldet sich unter
# DIESEM Namen an. Es bekommt zusaetzlich R_ACT_BAR (0x800), damit es
# VOR dem Absturz ein Feld in der Leiste besetzen kann -- nach dem
# Absturz ist das Feld leer, und genau das ist der sichtbare Beleg
# dafuer, dass der Kern den Toten abgeholt hat. Handeln an FENSTERN darf
# auch dieser Name nicht.
boesebar rechte=0x801 prog=/bin/plugboese
