# /etc/wmplug.conf -- who may do what. Read by /bin/wmplug (enable), not by the kernel:
# the kernel has no file system at boot and must not make name policy.
# `wmplug enable <name>` sends the mask down with WM_PLUG_GRANT (2126), root only.
#
# One line per extension:
#
#     <name> rights=0x<mask> [timeout=<ticks>] [prog=/bin/<file>]
#
# (the old keys rechte= and frist= are still read)
# `timeout=` is the time this plugin may let pass between two pickups (100 ticks = 1 s).
# Without it the kernel default applies (50 ticks). A plugin WITHOUT an entry here may take
# itself at most two seconds (kernel/wmplug.fi); only this file allows more, and only root reads it.
#
# `prog=` is the program `wmplug enable <name>` STARTS. Without it, `enable` only grants the rights.
#
# Everything after `#` is a remark. A name that is not listed gets R_DEFAULT = 0x1F from the
# kernel at registration: watch, touch nothing.
#
# The bits (kernel/wmplug.fi, R_*):
#
#     0x001 R_EV_WIN      window opens / closes
#     0x002 R_EV_FOCUS    focus changes
#     0x004 R_EV_DESK     workspace changes
#     0x008 R_EV_TILE     tile tree changed
#     0x010 R_EV_KEY      a claimed shortcut was pressed
#     0x100 R_ACT_WIN     place foreign windows (position, size, layer, area)
#     0x200 R_ACT_FOCUS   set focus
#     0x400 R_ACT_KEY     claim a shortcut
#     0x800 R_ACT_BAR     send text to the bar
#
# Every bit is checked on its own in the kernel before the action (sysgui.fi, do_plugact).
# Without a right the caller gets E_RIGHTS and the window stays as it was (see PL_DENY).

# The bar widget: may see what it needs for its display and do exactly one thing, deliver text.
uhr rights=0x807 timeout=100 prog=/bin/pluguhr

# The window rule engine: sees a window open and puts it in place.
regel rights=0x301 timeout=500 prog=/bin/plugregel

# The counter-proof program (kernel/user/plugboese.fi). It gets watching only, so that grabbing a
# foreign window returns an error code and the window provably stays. Do not widen this line.
boese rights=0x001 prog=/bin/plugboese

# The same program in crash mode (`plugboese segv`) registers under this name. It also gets
# R_ACT_BAR (0x800) so it can claim a bar field BEFORE the crash; the empty field afterwards
# proves the kernel reaped it. It may not act on windows either.
boesebar rights=0x801 prog=/bin/plugboese

# The global hotkey helper (kernel/user/hotkeyd.fi): sees keys (0x10) and may claim shortcuts (0x400). Reads /etc/hotkeys.conf.
hotkey rights=0x410 timeout=500 prog=/bin/hotkeyd
